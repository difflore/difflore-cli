[package]
name = "difflore-cli"
version = "0.8.0"
edition = "2024"
rust-version = "1.87"
authors = ["Zachary <hello@difflore.dev>"]
description = "Find the unwritten rules hiding in a GitHub repo's code review history and turn them into AGENTS.md."
documentation = "https://github.com/difflore/difflore-cli"
homepage = "https://difflore.dev"
repository = "https://github.com/difflore/difflore-cli"
readme = "README.md"
license = "Apache-2.0"
keywords = ["agents-md", "code-review", "claude-code", "cursor", "github"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["/.github", "/examples"]

[[bin]]
name = "difflore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
struct_field_names = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "thin"
